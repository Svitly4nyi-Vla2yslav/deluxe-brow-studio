name: Import approved Deluxe studio reels
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-studio-reels.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download two approved reels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://at.adobe.com/VH0ZnUl6xvRcodbq" \
            -o public/videos/deluxe-slow-luxury.mp4
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://at.adobe.com/Jv6tbowKPfyx9fEG" \
            -o public/videos/deluxe-brow-reel.mp4
          python3 - <<'PY'
          import os
          paths = ['public/videos/deluxe-slow-luxury.mp4', 'public/videos/deluxe-brow-reel.mp4']
          for path in paths:
              with open(path, 'rb') as f:
                  header=f.read(12)
              size=os.path.getsize(path)
              if size<1000000 or header[4:8]!=b'ftyp':
                  raise ValueError(f'{path} is not a valid MP4 ({size} bytes)')
              print(path, size, 'bytes: validated MP4')
          PY
      - name: Commit media into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/deluxe-slow-luxury.mp4 public/videos/deluxe-brow-reel.mp4
          git diff --cached --quiet && exit 0
          git commit -m "assets: add two approved Deluxe Brow Studio reels"
          git push origin HEAD:main
